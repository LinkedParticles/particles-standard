# mkdocs configuration for the particles-standard public repository — the site
# published at https://linkedparticles.org.
#
# This repo is a per-release scrubbed export of a private development upstream
# (see CONTRIBUTING.md). This config is authored in that upstream under
# publish/overlays/ and laid into the exported tree by the release export —
# edit it there, not on the public repo (a direct edit here is overwritten by
# the next export).
#
# It is deliberately a separate file from the upstream's own mkdocs.yml: that
# one navigates the SDK's user / operator / plugin-author guides and the
# development corpus, none of which is published here. This site has two faces
# at one origin — the front door (landing + the standard's two documents) and
# the artifact host, which serves the normative schemas byte-identical at their
# canonical identifiers. The artifact host is the hooks' work, not a checked-in
# directory: see hooks/copy_schema_artifacts.py.
#
# Build:  pip install -r docs-requirements.txt && mkdocs build --strict

site_name: Particles
site_description: "A git-like ledger for what an AI system believes: an open specification for provenance-tracked, calibrated-confidence agent knowledge."
site_url: https://linkedparticles.org
repo_url: https://github.com/LinkedParticles/particles-standard
repo_name: LinkedParticles/particles-standard

# The site is the standard's front door. The whitepaper review driver is a
# working document, not reader-facing: it stays in the repo and off the site.
exclude_docs: |
  spec/review-request-v2.2.md

theme:
  name: material
  # Brand + palette come from the design system: hooks/copy_design_tokens.py
  # materialises stylesheets/tokens.css and assets/favicon.svg from design/,
  # and docs/stylesheets/particles.css maps every Material colour variable onto
  # the --p-* tokens (hence `primary: custom` on both schemes). The header mark
  # is a Material inline icon so its core dot takes the header ink via
  # currentColor.
  custom_dir: overrides
  icon:
    logo: particles/mark
  favicon: assets/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

hooks:
  - hooks/copy_design_tokens.py
  # The artifact host: copies artifacts/schemas/** into the built site at
  # /schemas/… byte-identical, and generates docs/vocab.md from context.jsonld
  # so the `#`-fragment vocabulary namespace dereferences. The post-deploy
  # dereference workflow re-checks the served bytes against this tree.
  - hooks/copy_schema_artifacts.py

# tokens.css is generated into docs/stylesheets/ by the hook; particles.css is
# authored. Order matters: tokens first.
extra_css:
  - stylesheets/tokens.css
  - stylesheets/particles.css

# Forwards the palette to the embedded, self-contained demo pages (marked
# data-themed), which are iframes and so cannot read this document's
# `data-md-color-scheme`.
extra_javascript:
  - javascripts/graph-theme.js

copyright: >-
  © 2026 the LinkedParticles authors ·
  specification draft v2.2 (CC-BY) ·
  <a href="https://pypi.org/project/linkedparticles/">reference implementation on PyPI</a> (Apache-2.0) ·
  <a href="https://github.com/LinkedParticles/particles-engine-py/blob/main/SECURITY.md">security</a>

# Share/social metadata rendered by overrides/main.html; the PNG fallback
# icons sit beside the hook-materialised favicon.svg.
extra:
  social_image: https://linkedparticles.org/assets/social-card.png
  favicon_ico: assets/favicon.ico
  apple_touch_icon: assets/apple-touch-icon.png

  # ---- Web analytics: GoatCounter ---------------------------------------- #
  # THE site code for linkedparticles.org (the front door) — the single place
  # it is configured, and the only line to edit once the GoatCounter account
  # exists.
  #
  # The value is the subdomain of the GoatCounter site, i.e. the `MYCODE` in
  # `https://MYCODE.goatcounter.com`. `overrides/main.html` turns it into the
  # one script tag; there is nothing else to change.
  #
  # docs.linkedparticles.org names this same code deliberately: the
  # `linkedparticles` GoatCounter site is configured to accept both hostnames,
  # so the two sites report into one dashboard. Splitting them later means
  # creating a second GoatCounter site and changing the code in the engine
  # overlay's `mkdocs.yml` — nothing in the shared template moves.
  #
  # Sharing is legible because the recorded PATH carries the hostname:
  # GoatCounter keys a row on the path and never on the hostname, so
  # `overrides/main.html` prefixes it and this site's rows read
  # `linkedparticles.org/why/` rather than `/why/`. Without that prefix this
  # site's `/` and the docs site's `/` would be one row. Referrers are recorded
  # per pageview and are unaffected.
  #
  # GoatCounter is cookieless, stores no identifiers, and honours Do Not Track,
  # so the site needs no consent banner. Do not add one.
  #
  # Live: the dashboard is at https://linkedparticles.goatcounter.com.
  goatcounter_code: "linkedparticles"

plugins:
  - search

nav:
  - Home: index.md
  - Why Particles: why.md
  - See it work: walkthrough.md
  - About: about.md
  - Get started: https://docs.linkedparticles.org/user-guide/getting-started/
  - Docs: https://docs.linkedparticles.org/
  - The specification:
      - Overview: specification.md
      - Whitepaper: spec/whitepaper.md
      - Technical specification: spec/technical-specification.md
      - Conformance profile: spec/conformance-profile.md
      - Vocabulary: vocab.md
      - Whitepaper changelog: spec/whitepaper-changelog.md
  - Repositories:
      - Reference implementation (start here): https://github.com/LinkedParticles/particles-engine-py
      - The standard (this repo): https://github.com/LinkedParticles/particles-standard
      - Client library: https://github.com/LinkedParticles/particles-core-py

markdown_extensions:
  - admonition
  - attr_list
  - sane_lists
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - tables
  - toc:
      permalink: true
