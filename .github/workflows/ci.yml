# CI for the particles-standard public repository.
#
# This repo is a per-release scrubbed export of a private development upstream
# (see CONTRIBUTING.md). These workflows are authored in that upstream under
# publish/overlays/ and laid into the exported tree by the release export —
# edit them there, not on the public repo (a direct edit here is overwritten by
# the next export).
#
# Supply-chain convention (matches the upstream): every `uses:` is pinned to a
# full 40-char commit SHA, never a mutable `@vN` tag; the trailing `# vN`
# comment is the human-readable tag that SHA resolves to. Bump a SHA only
# deliberately.
#
# The standard repo is prose + normative artifacts (no Python distribution), so
# its check is a dependency-free docs smoke test: the artifacts parse and every
# relative doc link resolves.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check Signed-off-by on every PR commit
        run: >-
          python .github/dco_check.py --range
          "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Docs + artifact smoke check
        run: python .github/docs_check.py
